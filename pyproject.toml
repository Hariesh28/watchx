[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "watchx"
version = "0.1.0a1"
description = "A modern, interactive terminal watch utility for Windows and beyond."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hariesh" }]
keywords = ["watch", "terminal", "tui", "cli", "monitoring", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "textual>=8.2,<9",
  "rich>=14.1,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.16",
  "mypy>=1.15",
  "build>=1.2",
  "twine>=6.1",
]

[project.scripts]
watchx = "watchx.cli:main"

[project.urls]
Homepage = "https://github.com/Hariesh28/watchx"
Repository = "https://github.com/Hariesh28/watchx"
Issues = "https://github.com/Hariesh28/watchx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/watchx"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
